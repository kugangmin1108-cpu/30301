<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI & Firebase 통합 관리 대시보드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(1000px, 94%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; }
    .subtitle { text-align: center; color: #777; margin-bottom: 28px; font-size: 14px; }
    .auth-box { max-width: 420px; margin: 40px auto; display: flex; flex-direction: column; gap: 12px; }
    h2 { margin-top: 0; font-size: 22px; color: #42a5f5; border-bottom: 2px solid #e3f2fd; padding-bottom: 8px; }
    .notice { max-width: 420px; margin: 20px auto 0; padding: 14px; border-radius: 14px; background: #fff8e1; color: #6d4c41; font-size: 14px; line-height: 1.6; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; padding: 14px; border-radius: 16px; background: #f7f9fb; }
    .user-info { font-size: 14px; color: #555; }
    input, select, textarea { padding: 0 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; background: #fff; }
    input { height: 46px; }
    select { height: 46px; }
    textarea { width: 100%; min-height: 120px; padding: 14px; resize: vertical; font-family: Arial, sans-serif; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }
    button, .download-link { border: none; border-radius: 12px; padding: 0 16px; height: 46px; font-size: 14px; cursor: pointer; transition: 0.15s; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    button:hover, .download-link:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    .login-btn { background: #42a5f5; color: white; }
    .signup-btn { background: #7e57c2; color: white; }
    .logout-btn { background: #455a64; color: white; }
    .ask-btn { background: #42a5f5; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .add-btn { background: #66bb6a; color: white; }
    .tts-btn { background: #ff7043; color: white; }
    .edit-btn { background: #ffca28; color: #333; }
    .delete-btn { background: #ef5350; color: white; }
    .save-btn { background: #7e57c2; color: white; }
    .cancel-btn { background: #b0bec5; color: white; }
    .download-link { background: #7e57c2; color: white; }
    .dashboard-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; }
    .panel { background: #fcfdfe; border: 1px solid #eef2f5; border-radius: 20px; padding: 20px; }
    .flex-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .status { min-height: 24px; margin: 10px 0; color: #666; font-size: 13px; font-style: italic; }
    .answer-box { min-height: 140px; padding: 14px; border-radius: 12px; background: #f1f5f9; border: 1px solid #e2e8f0; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin-bottom: 12px; font-size: 14px; }
    .tts-controls { background: #fff3e0; padding: 12px; border-radius: 12px; margin-top: 10px; }
    .tts-grid { display: grid; grid-template-columns: 1fr 1fr 80px; gap: 8px; margin-bottom: 8px; }
    audio { width: 100%; margin-top: 8px; }
    .list { display: flex; flex-direction: column; gap: 12px; max-height: 600px; overflow-y: auto; padding-right: 4px; }
    .item { padding: 16px; border-radius: 16px; background: #f7f9fb; border: 1px solid #edf1f5; }
    .item-title { margin: 0 0 6px; font-size: 16px; font-weight: bold; color: #1e88e5; }
    .item-content { margin: 0; color: #444; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
    .item-date { margin-top: 8px; font-size: 11px; color: #999; }
    .item-actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
    .edit-box { display: flex; flex-direction: column; gap: 8px; }
    .empty { text-align: center; padding: 40px; color: #aaa; background: #f7f9fb; border-radius: 16px; font-size: 14px; }
    .hidden { display: none !important; }
    @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI & Firebase 통합 대시보드</h1>
    <div class="subtitle">Authentication + Realtime DB + ChatGPT 연동 + TTS 음성 변환</div>

    <section id="authSection">
      <div class="auth-box">
        <h2>로그인 / 회원가입</h2>
        <input id="emailInput" type="email" placeholder="이메일 주소" />
        <input id="passwordInput" type="password" placeholder="비밀번호 (6자리 이상)" />
        <button class="login-btn" id="loginBtn">로그인</button>
        <button class="signup-btn" id="signupBtn">회원가입</button>
      </div>
      <div class="notice">
        처음 사용하는 이메일은 <strong>회원가입</strong>을 먼저 누르세요.<br />
        이미 가입된 계정은 바로 <strong>로그인</strong>하시면 됩니다.
      </div>
    </section>

    <section id="mainSection" class="hidden">
      <div class="top-bar">
        <div class="user-info">접속 계정: <strong id="userEmail" style="color:#1e88e5;"></strong></div>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="dashboard-grid">
        <div class="panel">
          <h2>🤖 AI 어시스턴트 & TTS</h2>
          <div style="margin-bottom: 6px; font-weight: bold; font-size:14px;">질문 입력</div>
          <textarea id="questionInput" placeholder="ChatGPT에게 궁금한 점을 질문해보세요! (Ctrl + Enter로 전송 가능)"></textarea>
          
          <div class="flex-row" style="justify-content: flex-end; margin-top: 8px;">
            <button class="clear-btn" id="clearBtn">초기화</button>
            <button class="ask-btn" id="askBtn">AI 질문하기</button>
          </div>

          <div id="aiStatus" class="status">질문 대기 중...</div>

          <div style="margin-top: 16px; margin-bottom: 6px; font-weight: bold; font-size:14px;">AI 답변 결과</div>
          <div id="answerBox" class="answer-box">질문을 입력하면 여기에 답변이 나타납니다.</div>

          <div class="flex-row" style="justify-content: space-between;">
            <button class="add-btn" id="saveToDbBtn" disabled>📌 이 답변 보관함에 저장</button>
          </div>

          <div class="tts-controls">
            <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color: #e65100;">🔊 오디오 변환 옵션</div>
            <div class="tts-grid">
              <select id="modelSelect">
                <option value="tts-1">tts-1 (빠름)</option>
                <option value="tts-1-hd">tts-1-hd (고품질)</option>
              </select>
              <select id="voiceSelect">
                <option value="alloy">alloy (공용)</option>
                <option value="echo">echo (지성적인)</option>
                <option value="fable">fable (서사적인)</option>
                <option value="onyx">onyx (묵직한 남성)</option>
                <option value="nova">nova (친근한 여성)</option>
                <option value="shimmer">shimmer (밝은 여성)</option>
              </select>
              <input id="speedInput" type="number" min="0.25" max="4.0" step="0.1" value="1.0" title="속도" />
            </div>
            <button class="tts-btn" id="makeSpeechBtn" style="width: 100%;" disabled>🎧 답변을 음성으로 듣기</button>
            
            <div id="audioResult" class="hidden" style="margin-top: 10px; border-top: 1px dashed #ffb74d; padding-top: 8px;">
              <audio id="audioPlayer" controls></audio>
              <div style="text-align: right; margin-top: 6px;">
                <a id="downloadLink" class="download-link" href="#" style="height: 34px; font-size: 12px;">mp3 다운로드</a>
              </div>
            </div>
          </div>
        </div>

        <div class="panel">
          <h2>🗂️ 내 답변/메모 보관함</h2>
          <div style="background: #f8fafc; padding: 12px; border-radius: 12px; margin-bottom: 16px; border: 1px solid #e2e8f0;">
            <div style="font-weight: bold; font-size: 13px; margin-bottom: 6px; color:#475569;">✏️ 직접 메모 작성하기</div>
            <input id="manualTitle" type="text" placeholder="제목" style="width:100%; margin-bottom:6px; height:38px; font-size:13px;" />
            <input id="manualContent" type="text" placeholder="내용" style="width:100%; margin-bottom:8px; height:38px; font-size:13px;" />
            <button class="add-btn" id="manualAddBtn" style="width:100%; height:36px; font-size:13px;">메모 추가</button>
          </div>
          <div id="dbStatus" class="status" style="margin-bottom: 10px; font-weight: bold; color: #42a5f5;"></div>
          <div id="dataList" class="list"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import { getDatabase, ref, push, set, update, remove, onValue, off } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDO-v52Ehwphh5gW0WBzu9_DliMhOzy4Yo',
      authDomain: 'kang-f4e85.firebaseapp.com',
      databaseURL: 'https://kang-f4e85-default-rtdb.firebaseio.com',
      projectId: 'kang-f4e85',
      storageBucket: 'kang-f4e85.firebasestorage.app',
      messagingSenderId: '107057126084',
      appId: '1:107057126084:web:30f7bcb3f25dd2aa4a0791',
      measurementId: 'G-DJ52YTYQZM'
    };

    // [수정 완료] 새로 주신 신규 배포 URL 주소로 변경을 완료했습니다.
    const APPS_SCRIPT_AI_URL = 'https://script.google.com/macros/s/AKfycbxUzzfpGKHL5y81V0li5Tq9ILviIk6UjTsO2RwCWMPXCSpuGDwRCS0g5L4Ejz2uW42-/exec';
    const APPS_SCRIPT_TTS_URL = 'https://script.google.com/macros/s/AKfycbxUzzfpGKHL5y81V0li5Tq9ILviIk6UjTsO2RwCWMPXCSpuGDwRCS0g5L4Ejz2uW42-/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const authSection = document.getElementById('authSection');
    const mainSection = document.getElementById('mainSection');
    const emailInput = document.getElementById('emailInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const signupBtn = document.getElementById('signupBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userEmail = document.getElementById('userEmail');

    const questionInput = document.getElementById('questionInput');
    const answerBox = document.getElementById('answerBox');
    const askBtn = document.getElementById('askBtn');
    const clearBtn = document.getElementById('clearBtn');
    const aiStatus = document.getElementById('aiStatus');
    const saveToDbBtn = document.getElementById('saveToDbBtn');

    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const makeSpeechBtn = document.getElementById('makeSpeechBtn');
    const audioResult = document.getElementById('audioResult');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    const manualTitle = document.getElementById('manualTitle');
    const manualContent = document.getElementById('manualContent');
    const manualAddBtn = document.getElementById('manualAddBtn');
    const dbStatus = document.getElementById('dbStatus');
    const dataList = document.getElementById('dataList');

    let currentUser = null;
    let currentItemsRef = null;
    let lastGeneratedAnswer = "";

    function getAccountInfo() {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      if (!email || !password) { alert('이메일과 비밀번호를 작성해 주세요.'); return null; }
      if (password.length < 6) { alert('비밀번호는 6자리 이상이어야 합니다.'); return null; }
      return { email, password };
    }

    signupBtn.addEventListener('click', async () => {
      const info = getAccountInfo(); if (!info) return;
      try { await createUserWithEmailAndPassword(auth, info.email, info.password); alert('회원가입 성공!'); } 
      catch (err) { alert(getKoreanErrorMessage(err.code)); }
    });

    loginBtn.addEventListener('click', async () => {
      const info = getAccountInfo(); if (!info) return;
      try { await signInWithEmailAndPassword(auth, info.email, info.password); } 
      catch (err) { alert(getKoreanErrorMessage(err.code)); }
    });

    logoutBtn.addEventListener('click', async () => { try { await signOut(auth); } catch { alert('로그아웃 오류'); } });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user; userEmail.textContent = user.email;
        authSection.classList.add('hidden'); mainSection.classList.remove('hidden');
        clearPage(); startRealtimeListener(user.uid);
      } else {
        currentUser = null; stopRealtimeListener();
        authSection.classList.remove('hidden'); mainSection.classList.add('hidden');
      }
    });

    function startRealtimeListener(uid) {
      stopRealtimeListener();
      dbStatus.textContent = '🔄 서버 연결 중...';
      currentItemsRef = ref(database, `users/${uid}/items`);
      onValue(currentItemsRef, (snapshot) => { renderData(snapshot.val()); dbStatus.textContent = '✅ 동기화 완료'; }, (err) => { dbStatus.textContent = '❌ 로드 실패'; });
    }

    function stopRealtimeListener() { if (currentItemsRef) { off(currentItemsRef); currentItemsRef = null; } }

    saveToDbBtn.addEventListener('click', async () => {
      if (!currentUser || !lastGeneratedAnswer) return;
      const titlePrompt = prompt("이 보관글의 제목을 정해주세요:", "AI 요약본 - " + new Date().toLocaleDateString());
      if (titlePrompt === null) return;
      await push

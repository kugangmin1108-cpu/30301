<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 전기 안전 진단기</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#fce4ec);
  min-height:100vh;
  padding:30px;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:30px;
}

.card{
  background:#f7f9fb;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
}

input,
textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:10px;
}

textarea{
  min-height:150px;
  resize:vertical;
}

button{
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  color:white;
  font-weight:bold;
}

.login-btn{
  background:#42a5f5;
}

.signup-btn{
  background:#7e57c2;
}

.analyze-btn{
  background:#ef6c00;
}

.tts-btn{
  background:#26a69a;
}

.save-btn{
  background:#43a047;
}

.button-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.result{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
  background:white;
  border:1px solid #ddd;
  white-space:pre-wrap;
}

.record{
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ AI 전기 안전 진단기</h1>
<div class="subtitle">
전기 사용 상황을 입력하면 AI가 위험도를 분석합니다.
</div>

<div class="card">

<h2>로그인</h2>

<input type="email" placeholder="이메일">

<input type="password" placeholder="비밀번호">

<div class="button-row">
<button class="login-btn">로그인</button>
<button class="signup-btn">회원가입</button>
</div>

</div>

<div class="card">

<h2>전기 사용 상황 입력</h2>

<input
id="title"
placeholder="상황 제목 (예: 멀티탭 사용)"
>

<textarea
id="situation"
placeholder="예: 멀티탭에 전기포트와 전기장판을 동시에 연결했습니다."
></textarea>

<div class="button-row">
<button
class="analyze-btn"
onclick="analyzeSituation()">
AI 진단하기
</button>
</div>

<div
id="result"
class="result">
아직 진단 결과가 없습니다.
</div>

<div class="button-row">

<button
class="tts-btn"
onclick="playTTS()">
🔊 음성 듣기
</button>

<button
class="save-btn"
onclick="saveRecord()">
결과 저장
</button>

</div>

</div>

<div class="card">

<h2>진단 기록</h2>

<div id="records">

<div class="record">
저장된 기록이 없습니다.
</div>

</div>

</div>

</div>

<script>

let currentResult="";

async function analyzeSituation(){

  const text=
  document.getElementById("situation").value;

  if(!text){
    alert("상황을 입력하세요.");
    return;
  }

  // 나중에 ChatGPT API 연결

  currentResult=
`위험도 : 높음

원인 :
고전력 기기를 동시에 사용하고 있습니다.

예방 방법 :
1. 벽면 콘센트 분산 사용
2. 노후 멀티탭 교체
3. 정격전류 확인`;

  document.getElementById("result").innerText=
  currentResult;

}

function playTTS(){

  if(!currentResult){
    alert("먼저 진단하세요.");
    return;
  }

  const speech=
  new SpeechSynthesisUtterance(
    currentResult
  );

  speech.lang="ko-KR";

  speechSynthesis.speak(speech);

}

function saveRecord(){

  if(!currentResult){
    alert("먼저 진단하세요.");
    return;
  }

  const div=
  document.createElement("div");

  div.className="record";

  div.innerHTML=
  `
  <strong>${document.getElementById("title").value}</strong>
  <br><br>
  ${currentResult}
  `;

  document
  .getElementById("records")
  .prepend(div);

}

</script>

</body>
</html>
